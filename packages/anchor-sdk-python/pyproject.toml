[project]
name = "anchor-sdk"
version = "0.1.0"
description = "Typed Python client for Anchor's REST API (testnet-only dispute/escrow)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anchor_sdk*"]
