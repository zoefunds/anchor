[package]
name = "decision-relay"
version = "0.1.0"
edition = "2021"

[features]
no-entrypoint = []

[dependencies]
# Pinned to match Hyperlane's own workspace exactly (rust/sealevel/Cargo.toml
# in the monorepo at the pinned rev below) — a mismatched solana-program
# version produces distinct, incompatible types (AccountMeta, Pubkey, etc.)
# across the CPI boundary even though they look identical.
borsh = "1.5"
solana-program = "=3.0.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

account-utils = { git = "https://github.com/hyperlane-xyz/hyperlane-monorepo", rev = "b58c7eb7275cd61467805f8841d26682118b6f1b" }
hyperlane-sealevel-mailbox = { git = "https://github.com/hyperlane-xyz/hyperlane-monorepo", rev = "b58c7eb7275cd61467805f8841d26682118b6f1b", features = [
    "no-entrypoint",
] }
hyperlane-sealevel-message-recipient-interface = { git = "https://github.com/hyperlane-xyz/hyperlane-monorepo", rev = "b58c7eb7275cd61467805f8841d26682118b6f1b" }
serializable-account-meta = { git = "https://github.com/hyperlane-xyz/hyperlane-monorepo", rev = "b58c7eb7275cd61467805f8841d26682118b6f1b" }

[lib]
crate-type = ["cdylib", "lib"]
